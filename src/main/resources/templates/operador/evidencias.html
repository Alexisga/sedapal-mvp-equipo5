<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/common :: head('Revisar evidencias')}"></head><body>
<div th:replace="~{fragments/common :: demo}"></div><nav th:replace="~{fragments/common :: nav}"></nav><main class="container page-shell"><h1>Revisar evidencias</h1><p>Abra el archivo y compruebe su contenido antes de habilitar su consulta al ciudadano.</p><ul><li th:each="e : ${evidencias}"><a th:href="@{/evidencias/{id}(id=${e.id})}" th:text="${e.nombre}"></a><span th:if="${e.visible}"> Visible al ciudadano</span><form th:unless="${e.visible}" th:action="@{/operador/evidencias/{id}/publicar(id=${e.id})}" method="post"><input type="hidden" name="reclamoId" th:value="${param.reclamoId}"><button class="btn btn-sedapal">He revisado y apruebo su consulta ciudadana</button></form></li></ul><a th:href="@{/operador}">Volver</a></main></body></html>
