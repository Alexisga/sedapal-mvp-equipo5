<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light">
    <title th:text="${titulo + ' | SEDAPAL Reclamos'}">SEDAPAL Reclamos</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<nav th:fragment="nav" class="navbar navbar-expand-lg sedapal-navbar navbar-dark" aria-label="Navegación principal">
    <div class="container">
        <a class="navbar-brand fw-bold d-flex align-items-center" th:href="@{/panel}">
            <span class="brand-mark" aria-hidden="true">S</span><span>SEDAPAL Reclamos</span>
        </a>
        <div class="d-flex align-items-center gap-3 text-white">
            <span class="d-none d-md-inline">
                <strong th:text="${nombreUsuario}">Usuario</strong>
                <small class="role-label" th:text="${rolUsuario}">Rol</small>
            </span>
            <form th:action="@{/logout}" method="post" class="m-0">
                <button class="btn btn-sm btn-light" type="submit">Cerrar sesión</button>
            </form>
        </div>
    </div>
</nav>

<div th:fragment="alerts" aria-live="polite" aria-atomic="true">
    <div th:if="${mensaje}" class="alert alert-success alert-dismissible fade show" role="status">
        <span th:text="${mensaje}">Operación realizada.</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar mensaje"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${error}">Ocurrió un error.</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar mensaje"></button>
    </div>
</div>

<th:block th:fragment="scripts">
    <script th:src="@{/webjars/bootstrap/5.3.3/js/bootstrap.bundle.min.js}"></script>
    <script th:src="@{/js/app.js}"></script>
</th:block>
</body>
</html>
