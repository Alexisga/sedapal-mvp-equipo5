<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/common :: head('Consultar seguimiento')}"></head><body>
<div th:replace="~{fragments/common :: demo}"></div><main class="container page-shell"><h1>Consultar seguimiento</h1><form th:action="@{/consulta}" method="get"><label for="codigo">Código de seguimiento</label><input class="form-control" id="codigo" name="codigo" required><button class="btn btn-sedapal">Buscar</button></form><p th:text="${error}"></p><section th:if="${estado != null}"><h2 th:text="${codigo}"></h2><p>Estado actual <strong th:text="${estado}"></strong></p><ol><li th:each="e : ${eventos}"><span th:text="${e.estado}"></span> <time th:text="${e.fecha}"></time></li></ol><p>Última actualización <time th:if="${!#lists.isEmpty(eventos)}" th:text="${eventos[eventos.size()-1].fecha}"></time></p></section><a th:href="@{/login}">Iniciar sesión para acceder a información privada</a></main></body></html>
