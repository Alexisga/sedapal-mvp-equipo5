# Solo demostración académica detrás del proxy HTTPS del proveedor.
server.address=0.0.0.0
server.port=${PORT:8080}
server.forward-headers-strategy=framework
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=20m
spring.datasource.url=jdbc:h2:mem:sedapal-public-demo;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=false
spring.thymeleaf.cache=true
app.demo-data=true
app.demo-anonymous=true
app.demo-password=${DEMO_PASSWORD}
app.require-https=true
app.upload-dir=/tmp/sedapal-evidencias
logging.level.org.springframework.security=INFO
