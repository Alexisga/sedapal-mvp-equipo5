spring.application.name=sedapal-reclamos
server.port=8080

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/bd_reclamos_sedapal?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima}
spring.datasource.username=${DB_USER:sedapal_app}
spring.datasource.password=${DB_PASSWORD:sedapal123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.thymeleaf.cache=false
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
server.error.include-message=never

app.upload-dir=${UPLOAD_DIR:uploads/evidencias}
app.demo-data=${DEMO_DATA:false}
